<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study Activity Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Study Activity Tracker</h1>

  <form id="activity-form">
    <input type="text" id="title" placeholder="Activity (CFD, FEM...)" required>
    <input type="number" id="minutes" placeholder="Minutes" min="1" required>
    <input type="date" id="date" required>
    <button type="submit">Add</button>
  </form>

  <div class="summary">
    <p>Total minutes today: <span id="total-today">0</span></p>
  </div>

  <table id="activity-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Activity</th>
        <th>Minutes</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
